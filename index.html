<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon site moderne</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barre de navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MonSite</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#accueil">Accueil</a></li>
          <li class="nav-item"><a class="nav-link" href="#apropos">À propos</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Section Accueil -->
  <header class="bg-primary text-white text-center py-5" id="accueil">
    <h1>Bienvenue sur mon site moderne</h1>
    <p class="lead">Créé par thibaut MIKALA.</p>
    <button class="btn btn-light" onclick="afficherMessage()">Cliquez-moi</button>
  </header>

  <!-- Section À propos -->
  <section class="container my-5" id="apropos">
    <h2>À propos</h2>
    <p>Avec ThibautFashion l'habillement trouve de l'élégance.</p>
  </section>

  <!-- Section Contact -->
  <section class="container my-5" id="email">
    <h2>Login</h2>
    <form id="emailForm" class="row g-3">
      <div class="col-md-6">
        <label for="email" class="form-label">Email</label>
        <input type="text" class="form-control" id="email" required>
      </div>
      <div class="col-md-6">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div class="col-12">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="4" required></textarea>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-success">Envoyer</button>
      </div>
    </form>
    <div id="confirmation" class="alert alert-success mt-3 d-none">
      Merci pour votre message !
    </div>
  </section>

  <!-- Pied de page -->
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2026 Mon Site Web</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
